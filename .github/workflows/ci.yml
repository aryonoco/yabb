# =============================================================================
# YABB CI Workflow
# Runs format check, lint, and tests on every push and PR
# =============================================================================

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Format, Lint, Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load versions from versions.env
        run: |
          # Source versions.env and export to GitHub Actions environment
          if [ -f versions.env ]; then
            source versions.env
            echo "NIM_VERSION=$NIM_VERSION" >> $GITHUB_ENV
            echo "CHOOSENIM_VERSION=$CHOOSENIM_VERSION" >> $GITHUB_ENV
            echo "NPH_VERSION=$NPH_VERSION" >> $GITHUB_ENV
            echo "Loaded versions: NIM=$NIM_VERSION, CHOOSENIM=$CHOOSENIM_VERSION, NPH=$NPH_VERSION"
          else
            echo "ERROR: versions.env not found"
            exit 1
          fi

      - name: Cache Nim toolchain
        uses: actions/cache@v4
        id: nim-cache
        with:
          path: |
            ~/.choosenim
            ~/.nimble/bin
            ~/.nimble/pkgs2
          key: nim-${{ runner.os }}-${{ env.NIM_VERSION }}-${{ env.NPH_VERSION }}-${{ hashFiles('*.nimble') }}
          restore-keys: |
            nim-${{ runner.os }}-${{ env.NIM_VERSION }}-
            nim-${{ runner.os }}-

      - name: Install choosenim and Nim
        if: steps.nim-cache.outputs.cache-hit != 'true'
        run: |
          curl https://nim-lang.org/choosenim/init.sh -sSf | sh -s -- -y
          export PATH="$HOME/.nimble/bin:$PATH"
          echo "$HOME/.nimble/bin" >> $GITHUB_PATH
          choosenim ${{ env.NIM_VERSION }}

      - name: Add Nim to PATH (cache hit)
        if: steps.nim-cache.outputs.cache-hit == 'true'
        run: echo "$HOME/.nimble/bin" >> $GITHUB_PATH

      - name: Verify Nim version
        run: |
          nim --version
          nimble --version

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install nph formatter
        run: |
          if ! command -v nph &> /dev/null; then
            # nph requires Nim 2.2.x compiler internals. Build from source using
            # choosenim's Nim to avoid nimble resolving to old nim package (2.0.8)
            git clone --depth 1 --branch "v${{ env.NPH_VERSION }}" https://github.com/arnetheduck/nph.git /tmp/nph
            cd /tmp/nph
            nimble setup
            nim c -d:release -o:"$HOME/.nimble/bin/nph" src/nph.nim
            cd -
            rm -rf /tmp/nph
            echo "nph installed: $(nph --version)"
          else
            echo "nph already installed (from cache)"
          fi

      - name: Install project dependencies
        run: |
          # Remove stale nim package that nph build may have installed
          rm -rf ~/.nimble/pkgs2/nim-*
          nimble install -d --accept
          nimble setup

      - name: Check formatting
        run: just fmt-check

      - name: Lint
        run: just lint

      - name: Run tests
        run: just test
