# =============================================================================
# YABB CI Workflow
# Runs format check, lint, and tests on every push and PR
# =============================================================================

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Format, Lint, Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load versions from versions.env
        run: |
          # Source versions.env and export to GitHub Actions environment
          if [ -f versions.env ]; then
            source versions.env
            echo "NIM_VERSION=$NIM_VERSION" >> $GITHUB_ENV
            echo "CHOOSENIM_VERSION=$CHOOSENIM_VERSION" >> $GITHUB_ENV
            echo "Loaded versions: NIM=$NIM_VERSION, CHOOSENIM=$CHOOSENIM_VERSION"
          else
            echo "ERROR: versions.env not found"
            exit 1
          fi

      - name: Cache Nim toolchain
        uses: actions/cache@v4
        id: nim-cache
        with:
          path: |
            ~/.choosenim
            ~/.nimble/bin
            ~/.nimble/pkgs2
          key: nim-${{ runner.os }}-${{ env.NIM_VERSION }}-${{ hashFiles('*.nimble') }}
          restore-keys: |
            nim-${{ runner.os }}-${{ env.NIM_VERSION }}-
            nim-${{ runner.os }}-

      - name: Install choosenim and Nim
        if: steps.nim-cache.outputs.cache-hit != 'true'
        run: |
          curl https://nim-lang.org/choosenim/init.sh -sSf | sh -s -- -y
          export PATH="$HOME/.nimble/bin:$PATH"
          echo "$HOME/.nimble/bin" >> $GITHUB_PATH
          choosenim ${{ env.NIM_VERSION }}

      - name: Add Nim to PATH (cache hit)
        if: steps.nim-cache.outputs.cache-hit == 'true'
        run: echo "$HOME/.nimble/bin" >> $GITHUB_PATH

      - name: Verify Nim version
        run: |
          nim --version
          nimble --version

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install nph formatter
        run: |
          if ! command -v nph &> /dev/null; then
            # nph requires Nim compiler internals. Register choosenim's nim source
            # as a develop package so nph builds against Nim 2.2.6 (not 2.0.8 from registry)
            cd "$HOME/.choosenim/toolchains/nim-${{ env.NIM_VERSION }}"
            nimble develop -y
            cd -
            nimble install -y nph
          else
            echo "nph already installed (from cache)"
          fi

      - name: Install project dependencies
        run: nimble install -d --accept

      - name: Check formatting
        run: just fmt-check

      - name: Lint
        run: just lint

      - name: Run tests
        run: just test
