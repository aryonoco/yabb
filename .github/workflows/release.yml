# =============================================================================
# YABB Release Workflow
# Builds static musl binaries for x86_64 and ARM64, creates GitHub Release
# =============================================================================

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            nimble_task: release
          - arch: arm64
            runner: ubuntu-24.04-arm
            nimble_task: releaseArm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load versions from versions.env
        run: |
          # Source versions.env and export to GitHub Actions environment
          if [ -f versions.env ]; then
            source versions.env
            echo "NIM_VERSION=$NIM_VERSION" >> $GITHUB_ENV
            echo "CHOOSENIM_VERSION=$CHOOSENIM_VERSION" >> $GITHUB_ENV
            echo "Loaded versions: NIM=$NIM_VERSION, CHOOSENIM=$CHOOSENIM_VERSION"
          else
            echo "ERROR: versions.env not found"
            exit 1
          fi

      - name: Cache Nim toolchain
        uses: actions/cache@v4
        id: nim-cache
        with:
          path: |
            ~/.choosenim
            ~/.nimble/bin
            ~/.nimble/pkgs2
          key: nim-${{ matrix.arch }}-${{ env.NIM_VERSION }}-${{ hashFiles('*.nimble') }}
          restore-keys: |
            nim-${{ matrix.arch }}-${{ env.NIM_VERSION }}-
            nim-${{ matrix.arch }}-

      - name: Install choosenim and Nim
        if: steps.nim-cache.outputs.cache-hit != 'true'
        run: |
          curl https://nim-lang.org/choosenim/init.sh -sSf | sh -s -- -y
          export PATH="$HOME/.nimble/bin:$PATH"
          echo "$HOME/.nimble/bin" >> $GITHUB_PATH
          choosenim ${{ env.NIM_VERSION }}

      - name: Add Nim to PATH (cache hit)
        if: steps.nim-cache.outputs.cache-hit == 'true'
        run: echo "$HOME/.nimble/bin" >> $GITHUB_PATH

      - name: Verify Nim version
        run: |
          nim --version
          nimble --version

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools musl-dev

      - name: Install project dependencies
        run: |
          # Remove stale nim package that nph build may have installed
          rm -rf ~/.nimble/pkgs2/nim-*
          nimble install -d --accept
          nimble setup

      - name: Build static binary
        run: nimble ${{ matrix.nimble_task }}

      - name: Verify binary is static
        run: |
          echo "Binary info:"
          file bin/yabb
          echo ""
          echo "Checking for static linkage..."
          if ldd bin/yabb 2>&1 | grep -qE "not a dynamic executable|statically linked"; then
            echo "OK: Binary is statically linked"
          else
            echo "ERROR: Binary appears to be dynamically linked"
            ldd bin/yabb
            exit 1
          fi
          echo ""
          echo "Binary size:"
          ls -lh bin/yabb

      - name: Prepare release archive
        run: |
          # Extract version without 'v' prefix
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE_NAME="yabb-${VERSION}-linux-${{ matrix.arch }}"
          mkdir -p "${ARCHIVE_NAME}"

          # Copy binary
          cp bin/yabb "${ARCHIVE_NAME}/"

          # Copy completions
          cp completions/yabb.bash "${ARCHIVE_NAME}/"
          cp completions/yabb.fish "${ARCHIVE_NAME}/"
          cp completions/yabb.zsh "${ARCHIVE_NAME}/"

          # Copy and rename sample config
          cp config/yabb.toml.example "${ARCHIVE_NAME}/yabb.conf"

          # Copy installation instructions
          cp Install.txt "${ARCHIVE_NAME}/"

          # Create tarball
          tar -czvf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"

          # List contents for verification
          echo ""
          echo "Archive contents:"
          tar -tzvf "${ARCHIVE_NAME}.tar.gz"

          # Output for subsequent steps
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> $GITHUB_ENV

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ env.ARCHIVE_NAME }}.tar.gz
          retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz > SHA256SUMS
          echo "Generated checksums:"
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
