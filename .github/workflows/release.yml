# =============================================================================
# YABB Release Workflow
# Builds static musl binaries for x86_64 and ARM64, creates GitHub Release
# =============================================================================

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            march: x86-64-v2
            mtune: skylake
          - arch: arm64
            runner: ubuntu-24.04-arm
            march: armv8-a
            mtune: cortex-a72

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load versions from versions.env
        run: |
          # Source versions.env and export to GitHub Actions environment
          if [ -f versions.env ]; then
            source versions.env
            echo "NIM_VERSION=$NIM_VERSION" >> $GITHUB_ENV
            echo "Loaded versions: NIM=$NIM_VERSION"
          else
            echo "ERROR: versions.env not found"
            exit 1
          fi

      - name: Cache Nim toolchain
        uses: actions/cache@v4
        id: nim-cache
        with:
          path: |
            ~/nim-${{ env.NIM_VERSION }}
            ~/.nimble/bin
            ~/.nimble/pkgs2
          key: nim-${{ matrix.arch }}-${{ env.NIM_VERSION }}-${{ hashFiles('*.nimble') }}
          restore-keys: |
            nim-${{ matrix.arch }}-${{ env.NIM_VERSION }}-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential xz-utils musl-tools musl-dev

      - name: Build Nim from source
        if: steps.nim-cache.outputs.cache-hit != 'true'
        run: |
          cd ~
          echo "Installing Nim ${{ env.NIM_VERSION }} from source..."
          curl -LO "https://nim-lang.org/download/nim-${{ env.NIM_VERSION }}.tar.xz"
          tar xf "nim-${{ env.NIM_VERSION }}.tar.xz"
          cd "nim-${{ env.NIM_VERSION }}"
          sh build.sh
          ./bin/nim c -d:release koch
          ./koch boot -d:release
          ./koch nimble
          cd ..
          rm -f "nim-${{ env.NIM_VERSION }}.tar.xz"
          echo "Nim ${{ env.NIM_VERSION }} installed successfully"

      - name: Add Nim to PATH
        run: |
          echo "$HOME/nim-${{ env.NIM_VERSION }}/bin" >> $GITHUB_PATH
          echo "$HOME/.nimble/bin" >> $GITHUB_PATH

      - name: Verify Nim version
        run: |
          nim --version
          nimble --version

      - name: Install project dependencies
        run: |
          # Pre-emptively remove any stale nim package from cache
          rm -rf ~/.nimble/pkgs2/nim-*
          nimble install -d --accept
          nimble setup
          # Remove again in case nimble reinstalled nim from registry
          rm -rf ~/.nimble/pkgs2/nim-*

      - name: Build static binary
        run: |
          nim c -d:release --opt:speed --mm:orc -d:lto \
            --passC:-march=${{ matrix.march }} \
            --passC:-mtune=${{ matrix.mtune }} \
            --passC:-flto \
            --gcc.exe:musl-gcc --gcc.linkerexe:musl-gcc \
            --passL:-static --passL:-flto \
            -o:bin/yabb src/yabb.nim
          strip -s bin/yabb
          echo "Built: bin/yabb (static musl ${{ matrix.arch }})"

      - name: Verify binary is static
        run: |
          echo "Binary info:"
          file bin/yabb
          echo ""
          echo "Checking for static linkage..."
          if ldd bin/yabb 2>&1 | grep -qE "not a dynamic executable|statically linked"; then
            echo "OK: Binary is statically linked"
          else
            echo "ERROR: Binary appears to be dynamically linked"
            ldd bin/yabb
            exit 1
          fi
          echo ""
          echo "Binary size:"
          ls -lh bin/yabb

      - name: Prepare release archive
        run: |
          # Extract version without 'v' prefix
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE_NAME="yabb-${VERSION}-linux-${{ matrix.arch }}"
          mkdir -p "${ARCHIVE_NAME}"

          # Copy binary
          cp bin/yabb "${ARCHIVE_NAME}/"

          # Copy completions
          cp completions/yabb.bash "${ARCHIVE_NAME}/"
          cp completions/yabb.fish "${ARCHIVE_NAME}/"
          cp completions/yabb.zsh "${ARCHIVE_NAME}/"

          # Copy and rename sample config
          cp config/yabb.toml.example "${ARCHIVE_NAME}/yabb.conf"

          # Copy installation instructions
          cp Install.txt "${ARCHIVE_NAME}/"

          # Create tarball
          tar -czvf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"

          # List contents for verification
          echo ""
          echo "Archive contents:"
          tar -tzvf "${ARCHIVE_NAME}.tar.gz"

          # Output for subsequent steps
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> $GITHUB_ENV

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ env.ARCHIVE_NAME }}.tar.gz
          retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz > SHA256SUMS
          echo "Generated checksums:"
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
