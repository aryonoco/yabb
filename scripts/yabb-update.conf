# =============================================================================
# YABB Update Service Configuration
# Environment variables for yabb-update.service
# =============================================================================
# Install: sudo mkdir -p /etc/yabb && sudo cp yabb-update.conf /etc/yabb/update.conf
# =============================================================================

# Installation directory (default: /opt/yabb)
# INSTALL_DIR=/opt/yabb

# Pin to a specific version (default: latest)
# Uncomment to prevent automatic updates beyond this version
# YABB_VERSION=v0.4.3

# Skip checksum verification (not recommended)
# YABB_SKIP_CHECKSUM=1
